name: Daily YouTube stats

on:
  schedule:
    # 00:17 UTC = 08:17 Singapore. Off the hour on purpose: runs scheduled
    # at :00 are the most likely to be delayed when GitHub is busy.
    - cron: "17 0 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write         # needed to commit the new raw file

concurrency:
  group: daily-stats      # never let two runs write at once
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Extract
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/extract.py

      - name: Commit raw file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: raw stats for $(date -u +%F)"
            git push
          fi
